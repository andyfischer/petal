[package]
name = "petal"
version = "0.1.0"
edition = "2024"
description = "The Petal programming language: compiler, IR, and evaluator"
license = "MIT"
repository = "https://github.com/andyfischer/petal"

[features]
default = []
wasm = ["wasm-bindgen", "console_error_panic_hook"]
# Collect value-duplication statistics even in release builds. Stats are always
# collected in debug builds; this feature forces them on for release. See
# `src/stats.rs`.
dup-stats = []

[dependencies]
indexmap = { version = "2", features = ["serde"] }
smallvec = { version = "1", features = ["serde"] }
slotmap = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
wasm-bindgen = { version = "0.2", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }

[lib]
crate-type = ["cdylib", "rlib"]

# Measurement harnesses: Rust programs that drive the crate directly to time
# one cost (a rerun, a reload, a frame, a collection). They live beside the
# Petal benchmarks in `test/benchmarks/harness/` rather than in Cargo's default
# `examples/` (the repository's top-level `examples/` is Petal programs), and
# run as `cd core && cargo run --release --example <name> -- ...`.
# See docs/dev/scripts.md.
[[example]]
name = "dep_classes_frame"
path = "../test/benchmarks/harness/dep_classes_frame.rs"

[[example]]
name = "gc_pause"
path = "../test/benchmarks/harness/gc_pause.rs"

[[example]]
name = "implicit_keys_frame"
path = "../test/benchmarks/harness/implicit_keys_frame.rs"

[[example]]
name = "lower_passes"
path = "../test/benchmarks/harness/lower_passes.rs"

[[example]]
name = "reload_follow"
path = "../test/benchmarks/harness/reload_follow.rs"

[[example]]
name = "reload_timing"
path = "../test/benchmarks/harness/reload_timing.rs"

[[example]]
name = "rerun_timing"
path = "../test/benchmarks/harness/rerun_timing.rs"

[[example]]
name = "scene_frame"
path = "../test/benchmarks/harness/scene_frame/main.rs"

[[example]]
name = "static_frame"
path = "../test/benchmarks/harness/static_frame.rs"

[[example]]
name = "static_survey"
path = "../test/benchmarks/harness/static_survey.rs"

# `wasm-opt` starts from the WebAssembly MVP plus a couple of extras, while
# rustc has enabled a wider default feature set for wasm32-unknown-unknown
# since 1.82 (`rustc --print cfg --target wasm32-unknown-unknown`). Anything
# rustc emits that wasm-opt was not told to allow fails validation outright —
# "Bulk memory operations require bulk memory [--enable-bulk-memory]" — so the
# list below mirrors rustc's defaults. Keep the two in sync when the toolchain
# moves; the alternative, `wasm-opt = false`, costs ~30% of the payload.
[package.metadata.wasm-pack.profile.release]
wasm-opt = [
    "-O",
    "--enable-bulk-memory",
    "--enable-multivalue",
    "--enable-mutable-globals",
    "--enable-nontrapping-float-to-int",
    "--enable-reference-types",
    "--enable-sign-ext",
]

# Optimized profile for the binaries we ship in releases: smaller, faster.
# (`strip` removes debug symbols; `lto`/`codegen-units=1` trade build time for
# a leaner, faster binary.)
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Release codegen with symbols kept, for sampling profilers (`sample`, `perf`,
# `samply`). `cargo build --profile profiling` writes to target/profiling/petal.
# Identical optimization to `release` — only the debug info differs — so timings
# taken here transfer to a shipped build.
[profile.profiling]
inherits = "release"
debug = true
strip = false

# `cfg(kani)` is set by the Kani model checker (`cargo kani`), which compiles
# the proof harnesses in `src/proofs/`. See docs/dev/formal-verification.md.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
