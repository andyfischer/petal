[package]
name = "petal-ui"
version = "0.1.0"
edition = "2024"
description = "Standard mouse/keyboard interactivity primitives for Petal embedders"
license = "MIT"
repository = "https://github.com/andyfischer/petal"

[dependencies]
petal = { path = "../../core", default-features = false }
indexmap = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The headless tooling: `harness`, `scenario`, `drag_trace`, `panel_stubs`
# and the `petal-ui-run` / `petal-ui-propose-edit` binaries. On by default, so
# every existing dependent keeps compiling unchanged; a host that only needs
# the host contract (input, draw, hit, frame_core, ...) can depend on this
# crate with `default-features = false`.
[features]
default = ["tooling"]
tooling = []

[[bin]]
name = "petal-ui-run"
path = "src/bin/petal-ui-run.rs"
required-features = ["tooling"]

[[bin]]
name = "petal-ui-propose-edit"
path = "src/bin/petal-ui-propose-edit.rs"
required-features = ["tooling"]

# Every test and example below drives a script through `harness::Headless`,
# `scenario`, `panel_stubs` or one of the binaries. `tests/reference.rs` and
# `tests/scale.rs` don't, and also run with `--no-default-features`.

[[test]]
name = "drag_p2"
path = "tests/drag_p2.rs"
required-features = ["tooling"]

[[test]]
name = "drag_tools"
path = "tests/drag_tools.rs"
required-features = ["tooling"]

[[test]]
name = "drag"
path = "tests/drag.rs"
required-features = ["tooling"]

[[test]]
name = "focus"
path = "tests/focus.rs"
required-features = ["tooling"]

[[test]]
name = "gradients"
path = "tests/gradients.rs"
required-features = ["tooling"]

[[test]]
name = "harness_clock"
path = "tests/harness_clock.rs"
required-features = ["tooling"]

[[test]]
name = "hit"
path = "tests/hit.rs"
required-features = ["tooling"]

[[test]]
name = "host_data"
path = "tests/host_data.rs"
required-features = ["tooling"]

[[test]]
name = "host_natives"
path = "tests/host_natives.rs"
required-features = ["tooling"]

[[test]]
name = "inspector"
path = "tests/inspector.rs"
required-features = ["tooling"]

[[test]]
name = "layers"
