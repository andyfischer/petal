[package]
name = "garden-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "garden"
path = "src/main.rs"

[dependencies]
garden-core.workspace = true
garden-render.workspace = true
garden-script.workspace = true
gpp = { path = "../gpp" }
petal-query = { workspace = true }
winit = "0.30"
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"
# Per-machine persistent state (~/.garden/state/db.sqlite); `bundled` compiles
# SQLite from source so there is no system-library dependency. See src/state.rs.
rusqlite = { version = "0.32", features = ["bundled"] }
# Text-only system clipboard access (default features add image support we
# don't use).
arboard = { version = "3", default-features = false }
# Tree-sitter syntax highlighting (see src/syntax.rs).
tree-sitter = "0.26"
tree-sitter-highlight = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-json = "0.24"
tree-sitter-toml-ng = "0.7"
tree-sitter-md = "0.5"
tree-sitter-python = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-go = "0.25.0"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-java = "0.23.5"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-ruby = "0.23.1"
tree-sitter-php = "0.24.2"
tree-sitter-html = "0.23.2"
tree-sitter-css = "0.25.0"
tree-sitter-bash = "0.25.1"
tree-sitter-yaml = "0.7.2"
tree-sitter-lua = "0.5.0"
tree-sitter-scala = "0.26.0"
tree-sitter-haskell = "0.23.1"
tree-sitter-sequel = "0.3.11"
tree-sitter-zig = "1.1.2"
tree-sitter-nix = "0.3.0"
# Petal — Garden's own scripting language. The reference grammar lives in the
# petal repo alongside the language itself (see ../editor-support/).
tree-sitter-petal = { path = "../../editor-support/tree-sitter-petal" }
# Native file/folder picker (see src/file_dialog.rs). Cross-platform, so it is
# not in the macOS table below: the menu bar is macOS-only, but the picker is
# also opened by the host-handled `open_file_dialog` panel mutation.
rfd = "0.15"

# macOS native menu bar (File/Edit) — windowed frontend only.
[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.19"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSThread"] }

[dev-dependencies]
tempfile = "3"
