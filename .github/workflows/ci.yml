name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust-core:
    name: Rust core (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
            cli/target
            core-libs/petal-pkgman/target
          key: cargo-core-${{ runner.os }}-${{ hashFiles('core/Cargo.lock', 'cli/Cargo.lock', 'core-libs/petal-pkgman/Cargo.lock') }}
          restore-keys: cargo-core-${{ runner.os }}-

      - name: Build Rust
        run: cargo build --manifest-path core/Cargo.toml

      - name: Run Rust tests
        run: cargo test --manifest-path core/Cargo.toml

      # The `petal` binary and the package manager, which `core` leaves out so
      # embedded runtimes do not carry it. The CLI tests run the binary.
      - name: Run package manager tests
        run: cargo test --manifest-path core-libs/petal-pkgman/Cargo.toml

      - name: Run CLI tests
        run: cargo test --manifest-path cli/Cargo.toml

  # The fmt/lint/CST sweeps over every .ptl in the repo are `#[ignore]`d so a
  # local `cargo test` stays cheap; CI is where they always run. They are the
  # longest single step, so they get their own job and run alongside
  # `rust-core` rather than after it.
  rust-corpus-sweeps:
    name: Rust core (corpus sweeps)
    runs-on: ubuntu-latest
    env:
      # The four sweeps start together on half the cores each; the lint sweep
      # outlasts the others, so let each one use every core of the runner.
      PETAL_TEST_JOBS: 4
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: cargo-core-sweeps-${{ runner.os }}-${{ hashFiles('core/Cargo.lock') }}
          restore-keys: cargo-core-sweeps-${{ runner.os }}-

      - name: Run the corpus sweeps
        run: make expensive_lint_tests

  ts-tests:
    name: TypeScript (tsc + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cli/target
            core-libs/petal-ui-headless/target
            garden/target
          key: cargo-ts-${{ runner.os }}-${{ hashFiles('cli/Cargo.lock', 'core-libs/petal-ui-headless/Cargo.lock', 'garden/Cargo.lock') }}
          restore-keys: cargo-ts-${{ runner.os }}-

      - name: Build petal binary (used by vitest)
        run: cargo build --manifest-path cli/Cargo.toml

      # verify.ts aborts its whole run (exit 2) when the corpus has UI apps and
      # this driver is missing, which fails test/verify.test.ts. It and the MCP
      # DragExplain tool use garden-panel-run (petal-ui-run with Garden's panel
      # stubs); the implicit-imports and overload-merge tests use the generic
      # petal-ui-run.
      - name: Build garden-panel-run driver (used by tools/verify.ts)
        run: cargo build --manifest-path garden/Cargo.toml -p garden-panel-run --bin garden-panel-run

      - name: Build petal-ui-run driver (used by vitest)
        run: cargo build --manifest-path core-libs/petal-ui-headless/Cargo.toml --bin petal-ui-run

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Check committed stdlib manifest is current
        run: |
          npm run stdlib:json
          git diff --exit-code docs/stdlib.json \
            || { echo "::error::docs/stdlib.json is stale — run 'npm run stdlib:json' and commit the result"; exit 1; }

      - name: Type-check TypeScript
        run: npx tsc --noEmit

      - name: Run Vitest tests
        run: npx vitest run

  # petal-ui, its headless tooling, Garden's panel runner and the core-feature
  # tests over the panel corpus (test/ui-corpus, `make test-ui-corpus`). One
  # shared target dir: all four build the same petal and petal-ui. The corpus's
  # static_reload and static_cache take several minutes each.
  rust-ui:
    name: Rust UI (petal-ui, petal-ui-headless, garden-panel-run, ui-corpus)
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target-ui
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry & build (ui)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target-ui
          key: cargo-ui-${{ runner.os }}-${{ hashFiles('core-libs/petal-ui/Cargo.lock', 'core-libs/petal-ui-headless/Cargo.lock', 'garden/Cargo.lock', 'test/ui-corpus/Cargo.lock') }}
          restore-keys: cargo-ui-${{ runner.os }}-

      - name: Test petal-ui
        run: cargo test --manifest-path core-libs/petal-ui/Cargo.toml

      - name: Test petal-ui-headless
        run: cargo test --manifest-path core-libs/petal-ui-headless/Cargo.toml

      - name: Test garden-script and garden-panel-run
        run: cargo test --manifest-path garden/Cargo.toml -p garden-script -p garden-panel-run

      - name: Test the panel corpus (test/ui-corpus)
        run: cargo test --manifest-path test/ui-corpus/Cargo.toml

  rust-subprojects:
    name: Rust subprojects (petal-sdl, petal-fps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install SDL2 system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev

      - name: Cache Cargo registry & build (subprojects)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            integrations/petal-desktop-sdl/target
            examples/custom-apps/petal-fps/target
          key: cargo-subprojects-${{ runner.os }}-${{ hashFiles('integrations/petal-desktop-sdl/Cargo.lock', 'examples/custom-apps/petal-fps/Cargo.lock') }}
          restore-keys: cargo-subprojects-${{ runner.os }}-

      - name: Build petal-sdl
        run: cargo build --manifest-path integrations/petal-desktop-sdl/Cargo.toml

      - name: Build petal-fps
        run: cargo build --manifest-path examples/custom-apps/petal-fps/Cargo.toml

  # The C/C++ embedding bridge. Builds against the in-repo core/, core-libs/petal-ui/
  # and core-libs/petal-query/ crates, so a Rust API change that breaks it fails here.
  c-bridge:
    name: C bridge (petal-c-bridge, CMake + ctest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install CMake + Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build

      - name: Cache Cargo registry & build (c-bridge)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            integrations/petal-c-bridge/target
          key: cargo-c-bridge-${{ runner.os }}-${{ hashFiles('integrations/petal-c-bridge/Cargo.lock') }}
          restore-keys: cargo-c-bridge-${{ runner.os }}-

      - name: Configure
        run: cmake -S integrations/petal-c-bridge -B integrations/petal-c-bridge/build -G Ninja

      - name: Build (cargo staticlib + C/C++ tests)
        run: cmake --build integrations/petal-c-bridge/build

      - name: Test (C++ suite, C smoke, example, Rust unit tests)
        run: ctest --test-dir integrations/petal-c-bridge/build --output-on-failure

      - name: Build without the petal-query feature
        run: cargo build --release --no-default-features --manifest-path integrations/petal-c-bridge/Cargo.toml

  web-builds:
    name: Web builds (wasm + vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      # No apt binaryen: with no wasm-opt on PATH, wasm-pack downloads its own
      # (version 117), the one local builds use. Ubuntu's (108) produced a
      # petal-web-canvas pkg whose init fails in WebAssembly.Table.grow.

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Cache Cargo registry & build (wasm)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
            integrations/petal-web-canvas/rust/target
            integrations/petal-web-html/rust/target
          key: cargo-wasm-${{ runner.os }}-${{ hashFiles('core/Cargo.lock', 'integrations/petal-web-canvas/rust/Cargo.lock', 'integrations/petal-web-html/rust/Cargo.lock') }}
          restore-keys: cargo-wasm-${{ runner.os }}-

      # `Instant::now()` / `SystemTime::now()` panic on wasm32; core/clippy.toml
      # disallows them, and a native-only read carries an #[allow]. Only that
      # lint is enforced here.
      - name: core — std::time lint (wasm32)
        working-directory: core
        run: cargo clippy --lib --target wasm32-unknown-unknown -- -A clippy::all -A warnings -D clippy::disallowed_methods

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # ----- petal-web -----
      - name: petal-web — install deps
        working-directory: integrations/petal-web-html
        run: npm ci --no-audit --no-fund

      - name: petal-web — build wasm
        working-directory: integrations/petal-web-html
        run: bash build-wasm.sh

      - name: petal-web — vite build
        working-directory: integrations/petal-web-html
        run: npx vite build

      # ----- petal-web-canvas + petal-diagram-canvas (npm workspace) -----
      # diagram-canvas is a sample app that consumes the petal-web-canvas
      # integration (its WASM runtime + shared TS) via the npm workspace, so
      # install once at the repo root and build the integration's wasm first.
      - name: workspace — install deps
        run: npm ci --no-audit --no-fund

      - name: petal-web-canvas — build wasm
        run: npm run build:wasm --workspace integrations/petal-web-canvas

      - name: petal-web-canvas — vite build
        run: npm run build --workspace integrations/petal-web-canvas

      # Runs scripts through both built runtimes in Node: a pkg that builds
      # but traps on every script (a clock read, say) fails here.
      - name: wasm smoke test
        run: node tools/wasm-smoke.ts --require canvas,html

      - name: petal-diagram-canvas — vite build
        run: npm run build --workspace examples/custom-apps/diagram-canvas
