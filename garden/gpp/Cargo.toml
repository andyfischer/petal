[package]
name = "gpp"
version.workspace = true
edition.workspace = true
license.workspace = true

# The single wire definition of the Garden Pane Protocol. Deliberately
# dependency-slim (serde only) so both the garden host and any client library
# (petal-query) can link it without a cycle.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
