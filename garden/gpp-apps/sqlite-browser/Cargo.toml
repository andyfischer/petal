[package]
name = "sqlite-browser"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
petal-query = { workspace = true }
serde_json = "1"
# Same bundled build garden-app uses — no system SQLite needed, builds offline.
rusqlite = { version = "0.32", features = ["bundled"] }
# Synchronous Postgres client (fits the blocking provider handlers) with a
# native-TLS connector so servers that require/offer SSL — most managed
# Postgres — connect; plaintext servers negotiate down to no TLS.
postgres = "0.19"
postgres-native-tls = "0.5"
native-tls = "0.2"
