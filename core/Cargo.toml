[package]
name = "petal"
version = "0.1.0"
edition = "2024"
description = "The Petal programming language: compiler, IR, and evaluator"
license = "MIT"
repository = "https://github.com/andyfischer/petal"

[features]
default = ["tooling"]
# The developer tooling behind the `petal` command: the `cli`, `lsp` and
# `fix_imports` modules, which the binary (`cli/`) needs. Embedders turn it
# off (`default-features = false`); see the note at the top of src/lib.rs.
tooling = []
# Collect value-duplication statistics even in release builds. Stats are always
# collected in debug builds; this feature forces them on for release. See
# `src/stats.rs`.
dup-stats = []
# The bundled libraries: first-party packages written in Petal whose source is
# embedded in the crate when the feature is on. Off by default, so an embedder
# (notably the wasm builds) carries only what it imports; the `petal` command
# turns on `libraries`. Each is listed under [package.metadata.petal.bundled].
text_layout = []
bloom = ["text_layout"]
glsl = []
libraries = ["bloom", "text_layout", "glsl"]

# The packages core/build.rs embeds (`petal::bundled`), in order: `name =
# { dir, kind, feature }`. `dir` is relative to this crate and holds a
# petal.toml. `kind` is `core` (the always-in-scope builtins), `builtin` (a
# domain builtin package: natives every Env registers, in scope where
# imported), `ui` (the petal-ui interface; always embedded) or `library`
# (embedded only when `feature`, which must be declared above, is on). The
# build fails if an embedded package's [dependencies] name a bundled package
# that is left out. A new library is a directory, a line here and a feature.
[package.metadata.petal.bundled]
core = { dir = "packages/core", kind = "core" }
noise = { dir = "packages/noise", kind = "builtin" }
color = { dir = "packages/color", kind = "builtin" }
vec2 = { dir = "packages/vec2", kind = "builtin" }
autodiff = { dir = "packages/autodiff", kind = "builtin" }
json = { dir = "packages/json", kind = "builtin" }
io = { dir = "packages/io", kind = "builtin" }
ui = { dir = "../core-libs/petal-ui/prelude", kind = "ui" }
bloom = { dir = "../core-runtime/bloom", kind = "library", feature = "bloom" }
text_layout = { dir = "../core-runtime/text-layout", kind = "library", feature = "text_layout" }
glsl = { dir = "../core-runtime/glsl", kind = "library", feature = "glsl" }

[dependencies]
indexmap = { version = "2", features = ["serde"] }
smallvec = { version = "1", features = ["serde"] }
# Already in the tree through indexmap; used directly for the string intern
# table, which is keyed by content it reads out of the heap (`HashTable`).
hashbrown = { version = ">=0.16, <0.18", default-features = false }
slotmap = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

# Measurement harnesses: Rust programs that drive the crate directly to time
# one cost (a rerun, a reload, a frame, a collection). They live beside the
# Petal benchmarks in `test/benchmarks/harness/` rather than in Cargo's default
# `examples/` (the repository's top-level `examples/` is Petal programs), and
# run as `cd core && cargo run --release --example <name> -- ...`.
# See docs/dev/scripts.md.
[[example]]
name = "dep_classes_frame"
path = "../test/benchmarks/harness/dep_classes_frame.rs"

[[example]]
name = "gc_pause"
path = "../test/benchmarks/harness/gc_pause.rs"

[[example]]
name = "implicit_keys_frame"
path = "../test/benchmarks/harness/implicit_keys_frame.rs"

[[example]]
name = "lower_passes"
path = "../test/benchmarks/harness/lower_passes.rs"

[[example]]
name = "reload_follow"
path = "../test/benchmarks/harness/reload_follow.rs"

[[example]]
name = "reload_timing"
path = "../test/benchmarks/harness/reload_timing.rs"

[[example]]
name = "rerun_timing"
path = "../test/benchmarks/harness/rerun_timing.rs"

[[example]]
name = "scene_frame"
path = "../test/benchmarks/harness/scene_frame/main.rs"

[[example]]
name = "static_frame"
path = "../test/benchmarks/harness/static_frame.rs"

[[example]]
name = "static_survey"
path = "../test/benchmarks/harness/static_survey.rs"

# Optimized profile for the binaries we ship in releases: smaller, faster.
# (`strip` removes debug symbols; `lto`/`codegen-units=1` trade build time for
# a leaner, faster binary.)
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Release codegen with symbols kept, for sampling profilers (`sample`, `perf`,
# `samply`). `cargo build --profile profiling` writes to target/profiling/petal.
# Identical optimization to `release` — only the debug info differs — so timings
# taken here transfer to a shipped build.
[profile.profiling]
inherits = "release"
debug = true
strip = false

# `cfg(kani)` is set by the Kani model checker (`cargo kani`), which compiles
# the proof harnesses in `src/proofs/`. See docs/dev/formal-verification.md.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
