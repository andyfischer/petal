[package]
name = "garden-script"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
petal.workspace = true
# The standard input/draw contract + the `ui` prelude module (widgets,
# hit-testing, text metrics). Panel scripts run on it; see docs/architecture.md
# (Phase 3).
petal-ui.workspace = true
# Same major version petal itself uses; needed to construct Petal record
# (Map) values inside our native fns.
# The `emit(event, arg)` panel native converts the script's arg value into the
# JSON tree the GPP `emit` notification carries (see `panel::PanelHost::take_emitted`).
serde_json = "1"

[dev-dependencies]
# bloom and text_layout come from petal's bundled packages, which garden-script
# does not turn on: garden-app and garden-panel-run enable `petal/libraries`
# themselves, and garden-web (wasm) leaves them out. The tests drive bloom and
# text_layout panels, so they turn the libraries on for the test build only.
petal = { workspace = true, features = ["libraries"] }
# Round-trip tests write generated layout source to a real temp file and load
# it back through ScriptHost.
tempfile = "3"
