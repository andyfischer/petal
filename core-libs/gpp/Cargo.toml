[package]
name = "gpp"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "The Garden Pane Protocol wire definition: the JSON-RPC envelope, params/results and NDJSON framing shared by Petal UI hosts and data providers"
repository = "https://github.com/andyfischer/petal"

# The single wire definition of the Garden Pane Protocol. Deliberately
# dependency-slim (serde only) so both the garden host and any client library
# (petal-query) can link it without a cycle. It lives in core-libs, not
# garden/, so core libraries never depend on an app crate.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
