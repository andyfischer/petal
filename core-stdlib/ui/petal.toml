# ui — the petal-ui interface: the `native fn` declarations of every native a
# petal-ui host registers, plus the widget prelude written in Petal over them.
# Scripts write `import ui`.
#
# Its natives are implemented by the Rust crate in `native/` (`petal-ui`),
# which registers this package in memory (`petal_ui::register_prelude`); the
# petal binary bundles the same files (core/build.rs) so `petal lint`
# resolves `import ui` with no host present. Running a script that imports it
# needs a host that registers the natives.
[package]
name = "ui"
version = "0.2.0"
description = "The petal-ui interface: drawing, input and the widget prelude."
modules = "src"
