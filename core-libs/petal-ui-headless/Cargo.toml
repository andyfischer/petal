[package]
name = "petal-ui-headless"
version = "0.1.0"
edition = "2024"
description = "Run a petal-ui script with no renderer attached: the Headless driver, input scenarios, drag tracing and the petal-ui-run / petal-ui-propose-edit CLIs"
license = "MIT"
repository = "https://github.com/andyfischer/petal"

[dependencies]
petal = { path = "../../core", default-features = false }
petal-ui = { path = "../petal-ui" }
serde_json = "1"

[[bin]]
name = "petal-ui-run"
path = "src/bin/petal-ui-run.rs"

[[bin]]
name = "petal-ui-propose-edit"
path = "src/bin/petal-ui-propose-edit.rs"

# Release codegen with symbols kept, for a sampling profiler; mirrors
# petal-ui's.
[profile.profiling]
inherits = "release"
debug = true
strip = false

# Dependencies (the `petal` VM and compiler above all) are optimized in dev
# and test builds, as in petal-ui: the CLI tests drive whole apps for dozens
# of frames each. Debug assertions and overflow checks stay on.
[profile.dev.package."*"]
opt-level = 2
