[package]
name = "petal-ui-corpus"
version = "0.1.0"
edition = "2024"
description = "Core-feature tests that need a UI host: the frame gate, memoized scopes, the static-value cache, the effect audit and direct manipulation, over the panel corpus"
license = "MIT"
publish = false

# Tests only: everything is under tests/. The library target is empty and
# exists because cargo needs one.
[dependencies]
# The feature set petal-ui builds `petal` with, so these tests run the
# runtime an embedder gets (no `tooling`).
petal = { path = "../../core", default-features = false }
petal-ui = { path = "../../core-libs/petal-ui" }
serde_json = "1"

# Mirrors petal-ui's: dependencies (the `petal` VM and compiler above all) are
# optimized in dev and test builds. The corpus oracles drive every panel app
# for dozens of frames each, and with an unoptimized VM gating, memo and
# effect_audit alone took ~13 minutes; with this they run in well under one.
# Debug assertions and overflow checks stay on.
[profile.dev.package."*"]
opt-level = 2

# Release codegen with symbols kept, for a sampling profiler over the
# `--ignored` measurements; mirrors petal-ui's.
[profile.profiling]
inherits = "release"
debug = true
strip = false
