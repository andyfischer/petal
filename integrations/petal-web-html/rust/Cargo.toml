[package]
name = "petal-web-html"
version = "0.1.0"
edition = "2024"
description = "WASM bindings for running Petal element-tree scripts in an HTML page"
license = "MIT"
repository = "https://github.com/andyfischer/petal"

[dependencies]
petal = { path = "../../../core" }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
serde_json = "1"

[lib]
crate-type = ["cdylib"]

# This crate is its own workspace root, so `core/Cargo.toml`'s profile does not
# apply here.
[profile.release]
lto = true
codegen-units = 1

# `wasm-opt` starts from the WebAssembly MVP plus a couple of extras, while
# rustc has enabled a wider default feature set for wasm32-unknown-unknown
# since 1.82 (`rustc --print cfg --target wasm32-unknown-unknown`). Anything
# rustc emits that wasm-opt was not told to allow fails validation outright —
# "Bulk memory operations require bulk memory [--enable-bulk-memory]" — so the
# list below mirrors rustc's defaults. Keep the two in sync when the toolchain
# moves; the alternative, `wasm-opt = false`, costs ~30% of the payload.
# `integrations/petal-web-canvas/rust/Cargo.toml` and
# `garden/garden-web/Cargo.toml` carry the same list (wasm-pack reads it per
# crate, so it cannot be inherited).
[package.metadata.wasm-pack.profile.release]
wasm-opt = [
    "-O",
    "--enable-bulk-memory",
    "--enable-multivalue",
    "--enable-mutable-globals",
    "--enable-nontrapping-float-to-int",
    "--enable-reference-types",
    "--enable-sign-ext",
]
