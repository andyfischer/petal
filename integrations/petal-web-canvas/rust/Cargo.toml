[package]
name = "petal-web-canvas"
version = "0.1.0"
edition = "2024"
description = "WASM bindings for running Petal drawing scripts in an HTML canvas"
license = "MIT"
repository = "https://github.com/andyfischer/petal"

[dependencies]
petal = { path = "../../../rust" }
petal-ui = { path = "../../../petal-ui" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
crate-type = ["cdylib"]

# Mirrors `rust/Cargo.toml` — see the note there. wasm-pack reads this metadata
# per crate, so the list has to be repeated rather than inherited.
[package.metadata.wasm-pack.profile.release]
wasm-opt = [
    "-O",
    "--enable-bulk-memory",
    "--enable-multivalue",
    "--enable-mutable-globals",
    "--enable-nontrapping-float-to-int",
    "--enable-reference-types",
    "--enable-sign-ext",
]
