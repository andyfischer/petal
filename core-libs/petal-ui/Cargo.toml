[package]
name = "petal-ui"
version = "0.1.0"
edition = "2024"
description = "Standard mouse/keyboard interactivity primitives for Petal embedders"
license = "MIT"
repository = "https://github.com/andyfischer/petal"

[dependencies]
petal = { path = "../../core", default-features = false }
indexmap = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# The tests and benchmarks drive scripts through `Headless` and scenarios. A
# dev-dependency back on a crate that depends on this one is fine for
# integration tests and examples: they link the same `petal-ui` library the
# headless crate does. (Unit tests under `src/` cannot use it — they build a
# second copy of this crate — so nothing there does.)
petal-ui-headless = { path = "../petal-ui-headless" }
# The tests import bloom and text_layout, which `petal` bundles only with
# these features; a dev-dependency does not reach crates that use petal-ui.
petal = { path = "../../core", default-features = false, features = ["libraries"] }

# Release codegen with symbols kept, for a sampling profiler (`sample`,
# `samply`) over `bench_panel`; mirrors the `petal` crate's own profile.
[profile.profiling]
inherits = "release"
debug = true
strip = false

# Dependencies (the `petal` VM and compiler above all) are optimized in dev
# and test builds; this crate itself is not, so it still rebuilds quickly.
# The integration tests drive whole apps for dozens of frames each, and an
# unoptimized VM made the suite a quarter of an hour: the corpus oracles in
# tests/{gating,memo,effect_audit}.rs alone ran ~13 minutes, and run in well
# under one with this. Debug assertions and overflow checks stay on.
[profile.dev.package."*"]
opt-level = 2
