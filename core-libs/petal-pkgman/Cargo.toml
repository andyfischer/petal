[package]
name = "petal-pkgman"
version = "0.1.0"
edition = "2024"
description = "The Petal package manager: git dependencies, petal.lock, vendor/, bundles"
license = "MIT"
repository = "https://github.com/andyfischer/petal"

# Not a dependency of `petal` itself: the runtimes embedded in other programs
# (browser, SDL, C) do not carry it. The `petal` CLI (`cli/`) links it and
# registers it with `petal::package_manager::register`.
[dependencies]
petal = { path = "../../core" }
serde_json = { version = "1", features = ["preserve_order"] }
