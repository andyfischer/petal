[package]
name = "petal-fantasy-nes"
version = "0.1.0"
edition = "2024"
description = "An NES-style fantasy console driven entirely by Petal carts"
license = "MIT"
repository = "https://github.com/andyfischer/petal"

[[bin]]
name = "fantasy-nes"
path = "src/main.rs"

[dependencies]
petal = { path = "../../rust" }
petal-ui = { path = "../../petal-ui" }
petal-sdl = { path = "../petal-desktop-sdl" }
sdl2 = { version = "0.37", features = ["image", "ttf"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"

[profile.release]
opt-level = 3
lto = "thin"

# A debug build of the interpreter runs roughly 10x slower than a release one
# (docs/dev/performance.md), and a cart re-runs its whole script every frame at
# 60Hz. Optimizing just the `petal` dependency keeps `cargo run` (fast to link,
# debuggable host code) inside the frame budget.
[profile.dev.package.petal]
opt-level = 3
