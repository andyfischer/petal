# garden_config — the interface of Garden's config host: the `native fn`
# declarations of the natives `init.ptl` builds a layout with. A config
# script writes `import garden_config`.
#
# Garden registers this package in memory (garden-script/src/lib.rs) and
# provides the interface `garden_config` at this version. The stock CLI finds
# it as a path dependency of the script's project, or ad hoc with
# `petal check -I garden/garden-script/packages`.
[package]
name = "garden_config"
version = "0.1.0"
